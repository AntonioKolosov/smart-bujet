services:
  backend_dev:
    image: smart-bujet-backend:latest
    container_name: smart_bujet_backend_dev
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - default
      - caddy_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 200M
        reservations:
          memory: 64M

networks:
  default:
  caddy_net:
    name: smart-bujet_smart_bujet_net
    external: true
