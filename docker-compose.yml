services:
  caddy:
    image: caddy:2-alpine
    container_name: smart_bujet_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - smart_bujet_net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  backend:
    build: .
    image: smart-bujet-backend:latest
    container_name: smart_bujet_backend
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      - smart_bujet_net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 160M

networks:
  smart_bujet_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

