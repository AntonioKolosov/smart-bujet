name: Deploy Smart Bujet to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax
        run: |
          python -m py_compile $(find src scripts -name "*.py")

  deploy:
    needs: lint-and-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/ag_admin/smart-bujet"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/AntonioKolosov/smart-bujet.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            sudo -n docker compose up -d --build
            sudo -n docker image prune -f
