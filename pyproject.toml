[project]
name = "smart-bujet"
version = "0.1.0"
description = "Smart Bujet Project"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "aiogram>=3.10",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "google-genai",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade (Python 3.12 syntax)
    "PLR2044", # empty comment lines (#)
    "RUF022",  # sort __all__
    "SIM",     # flake8-simplify
    "G",       # flake8-logging-format
]
ignore = [
    "B008",    # FastAPI dependency injection defaults
    "BLE001",  # Do not catch blind exception (critical for resilience boundaries)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

